[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliv-ai"
version = "1.0.0"
description = "Terminal-native AI coding agent with time-travel undo, security guardian, and project onboarding"
readme = "README.MD"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Meghanath M M"},
]
keywords = [
    "ai", "agent", "cli", "coding", "llm", "groq", "ollama",
    "terminal", "security", "rag", "mcp", "code-analysis",
    "developer-tools", "code-review", "automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "pygments>=2.17.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
online = ["groq>=0.4.0"]
offline = ["ollama>=0.1.0", "numpy>=1.26"]
all = ["groq>=0.4.0", "ollama>=0.1.0", "numpy>=1.26"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
cliv = "cliv.cli:main"

[project.urls]
Homepage = "https://github.com/Meghanath-M-M/cliv-ai-agent"
Repository = "https://github.com/Meghanath-M-M/cliv-ai-agent"
Issues = "https://github.com/Meghanath-M-M/cliv-ai-agent/issues"
Documentation = "https://github.com/Meghanath-M-M/cliv-ai-agent#readme"

[tool.hatch.build]
include = [
    "cliv/**",
    "README.MD",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"